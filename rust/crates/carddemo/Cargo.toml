[package]
name = "carddemo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cobol.workspace = true
vsam.workspace = true
cics.workspace = true
online.workspace = true
batch.workspace = true
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
libc.workspace = true
# `carddemo online --cobol`: the original COBOL programs on the CICS bridge. libcob is loaded at run
# time, so building needs no GnuCOBOL; only `--cobol` does.
cobridge = { path = "../cobridge" }

[dev-dependencies]
# cobridge::as_cdcics_call, for the panic hook test
cobridge = { path = "../cobridge", features = ["test-hooks"] }
