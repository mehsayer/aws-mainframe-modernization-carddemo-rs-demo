[package]
name = "carddemo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cobol.workspace = true
vsam.workspace = true
cics.workspace = true
online.workspace = true
batch.workspace = true
anyhow.workspace = true
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
chrono.workspace = true
cobridge = { path = "../cobridge", optional = true }

[features]
# `carddemo online --cobol`: the original COBOL programs on the CICS bridge (needs GnuCOBOL's libcob).
# Build without it: cargo build --release --no-default-features
default = ["cobol"]
cobol = ["dep:cobridge"]
